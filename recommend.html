<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>分数推荐 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css?v=20261020p">
</head>
<body data-page="recommend">
  <div class="page">
    <div class="navbar">
      <button class="back-btn" onclick="history.back()">‹</button>
      <div class="title">分数推荐</div>
    </div>

    <div class="search-bar">
      <span class="icon">🔢</span>
      <input type="number" id="rec-score" placeholder="输入你的预估总分（如 230）" inputmode="numeric">
      <button class="clear" id="rec-btn" style="display:block;color:var(--primary);font-weight:600">推荐</button>
    </div>
    <div style="padding:0 12px;font-size:11px;color:var(--text-light)">
      💡 依据 2026 预测分数线（估算），按 冲(高5-15分) / 稳(±5分) / 保(低5-15分) 三档推荐，仅供参考。
    </div>

    <div id="rec-body"></div>

    <div style="height:20px"></div>
    <div class="tabbar"></div>
  </div>

  <script src="js/data-core.js?v=20261020p" defer></script>
  <script src="js/app.js?v=20261020p" defer></script>
</body>
</html>
