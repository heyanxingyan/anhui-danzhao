<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>专业查询 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css?v=20261021a">
</head>
<body data-page="major-search">
  <div class="page">
    <div class="navbar">
      <div class="title">专业查询</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-bar">
      <span class="icon">🔍</span>
      <input type="text" id="major-search" placeholder="输入专业或大类，如：计算机、护理">
    </div>

    <!-- 搜索命中「专业大类」时的联想卡：搜「计算机」优先告诉你能报哪个大类 -->
    <div id="major-cat-cards"></div>

    <!-- 专业大类筛选 -->
    <div class="filter-bar" id="major-cat-filter"></div>

    <!-- 专业列表 -->
    <div id="major-list" style="padding-bottom:20px"></div>

    <div class="tabbar"></div>
  </div>

  <script src="js/data.js?v=20261021a" defer></script>
  <script src="js/app.js?v=20261021a" defer></script>
</body>
</html>
