<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>院校列表 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css?v=20261028g">
</head>
<body data-page="college-list">
  <div class="page">
    <div class="navbar">
      <button class="back-btn" onclick="typeof backOrHome==='function'?backOrHome():location.href='index.html'">‹</button>
      <div class="title">院校列表</div>
    </div>

    <!-- 搜索框 -->
    <div class="search-bar">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" width="16" height="16"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg></span>
      <input type="text" id="college-search" placeholder="搜索院校名称或专业">
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar" id="city-filter"></div>
    <div class="filter-bar" id="nature-filter"></div>
    <div class="filter-bar" id="type-filter"></div>
    <div class="filter-bar" id="level-filter"></div>
    <div class="filter-bar" id="rule-filter"></div>
    <div class="filter-bar" id="interview-filter"></div>

    <div style="margin:0 12px 8px;padding:6px 10px;background:var(--primary-light);border-radius:8px;font-size:11px;color:var(--primary-deep);line-height:1.6">
      列表中"参考分"为估算值；对口本科院校带专属标签；2026录取规则/面试信息见院校详情页。
    </div>

    <!-- 院校列表 -->
    <div id="college-list"></div>

    <div class="load-more" id="load-more">下拉加载更多</div>

    <div style="height:20px"></div>

    <div class="tabbar"></div>
  </div>

  <script src="js/data-list.js?v=20261028g" defer></script>
  <script src="js/app.js?v=20261028g" defer></script>
</body>
</html>
