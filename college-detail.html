<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>院校详情 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css?v=20261020z">
</head>
<body data-page="college-detail">
  <div class="page">
    <div class="navbar">
      <button class="back-btn" onclick="goBackSmart()">‹</button>
      <div class="title">院校详情</div>
    </div>

    <!-- 院校头部 -->
    <div class="detail-header" id="detail-head" style="position:relative"></div>

    <!-- 基本信息 -->
    <div class="info-grid" id="basic-info"></div>

    <!-- Tab 切换 -->
    <div class="tab-switch">
      <div class="tab-item active" data-tab="plan">招生计划</div>
      <div class="tab-item" data-tab="rule">录取规则</div>
      <div class="tab-item" data-tab="score">2026 分数</div>
      <div class="tab-item" data-tab="intro">学校简介</div>
    </div>

    <!-- Tab 面板 -->
    <div class="tab-panel active" id="panel-plan"></div>
    <div class="tab-panel" id="panel-rule"></div>
    <div class="tab-panel" id="panel-score">
      <div id="score-2026-panel"></div>
      <div class="note">数据说明：本栏<strong>只收录 2026 年</strong>院校官网、安徽省教育招生考试院页面上可查证的最低录取分，每个数字都附来源链接与官网原文摘录；查不到的院校如实标注「待核实／未公布」，<strong>不提供任何估算分数</strong>。合格线（文化素质测试 82 分、校考合格线）不等于录取最低分，故不在此处展示。2026 年数据供 2027 考生参考，实际录取以官方最新公布为准。</div>
    </div>
    <div class="tab-panel" id="panel-intro"></div>

    <div style="height:20px"></div>
    <div class="tabbar"></div>
  </div>

  <script src="js/data.js?v=20261020z" defer></script>
  <script src="js/exam-groups.js?v=20261020z" defer></script>
  <script src="js/special-policy.js?v=20261020z" defer></script>
  <script src="js/app.js?v=20261020z" defer></script>
</body>
</html>
