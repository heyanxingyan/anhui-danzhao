<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>中职起点 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css?v=20261016w">
</head>
<body data-page="zhongzhi">
  <div class="page">
    <div class="navbar">
      <button class="back-btn" onclick="history.back()">‹</button>
      <div class="title">中职起点</div>
    </div>

    <!-- 板块介绍 -->
    <div class="about-section" style="margin:10px 12px">
      <h3>🛠️ 中职起点招生说明</h3>
      <p id="zz-desc"></p>
      <p><b>报考条件：</b><span id="zz-condition"></span></p>
      <p><b>考试科目：</b><span id="zz-subjects"></span></p>
      <p><b>录取规则：</b><span id="zz-rule"></span></p>
    </div>

    <!-- 子标签：中职专科 / 对口本科 -->
    <div class="subtabs" id="zz-tabs">
      <button class="subtab active" data-tab="zhuanke">🛠️ 中职专科</button>
      <button class="subtab" data-tab="benke">🎓 对口本科</button>
    </div>

    <!-- 中职专科面板 -->
    <div id="panel-zhuanke">
      <div class="zz-tip">面向中职毕业生的高职（专科）分类考试，下列院校招收中职专科生。</div>
      
      <!-- 搜索栏 -->
      <div class="search-bar" style="margin:0 12px 10px">
        <span class="icon">🔍</span>
        <input type="text" id="zz-zk-search-input" placeholder="输入院校名搜索">
        <button class="clear" id="zz-zk-search-clear">✕</button>
      </div>
      
      <div id="zz-zhuanke-list"></div>
      <a href="college-list.html?category=zhongzhi" class="btn-primary">在院校列表中查看全部并筛选 ›</a>
    </div>

    <!-- 对口本科面板：内容与独立页 benke.html 共用 js/benke-content.js，保持完全一致 -->
    <div id="panel-benke" style="display:none">
      <!-- 搜索栏（共享内容里不含搜索，这里保留以便筛选院校） -->
      <div class="search-bar" style="margin:10px 12px">
        <span class="icon">🔍</span>
        <input type="text" id="zz-bk-search-input" placeholder="输入院校名搜索">
        <button class="clear" id="zz-bk-search-clear">✕</button>
      </div>

      <div id="zz-benke-list"></div>
    </div>

    <div style="height:20px"></div>
    <div class="tabbar"></div>
  </div>

  <script src="js/data.js?v=20261016w"></script>
  <script src="js/benke-schools.js?v=20261016w"></script>
  <script src="js/benke-content.js?v=20261016w"></script>
  <script src="js/app.js?v=20261016w"></script>
</body>
</html>
