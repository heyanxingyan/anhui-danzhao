<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>录取概率测算 - 安徽单招信息查询</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .prob-container { padding: 12px; }
    .prob-card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .prob-label { font-size: 14px; font-weight: 600; color: #333; margin-bottom: 10px; }
    .prob-input-row { display: flex; align-items: center; gap: 10px; }
    .prob-input { flex: 1; height: 44px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 16px; outline: none; }
    .prob-input:focus { border-color: #1890ff; }
    .prob-unit { font-size: 14px; color: #888; }
    .prob-slider-value { font-size: 24px; font-weight: 700; color: #1890ff; text-align: center; margin-bottom: 8px; }
    .prob-slider { width: 100%; height: 6px; -webkit-appearance: none; background: #e8e8e8; border-radius: 3px; outline: none; }
    .prob-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #1890ff; cursor: pointer; box-shadow: 0 2px 6px rgba(24,144,255,.4); }
    .prob-result { background: linear-gradient(135deg,#1890ff,#36cfc9); color: #fff; border-radius: 12px; padding: 20px; text-align: center; margin-top: 12px; }
    .prob-result-title { font-size: 14px; opacity: .9; margin-bottom: 8px; }
    .prob-percent { font-size: 48px; font-weight: 700; line-height: 1; }
    .prob-desc { font-size: 13px; opacity: .9; margin-top: 10px; line-height: 1.6; }
    .prob-detail { background: #fff; border-radius: 12px; padding: 16px; margin-top: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .prob-detail-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed #f0f0f0; font-size: 13px; }
    .prob-detail-row:last-child { border-bottom: none; }
    .prob-detail-row b { color: #222; }
    .prob-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-left: 6px; }
    .prob-badge.high { background: #f6ffed; color: #52c41a; }
    .prob-badge.mid { background: #fff7e6; color: #fa8c16; }
    .prob-badge.low { background: #fff2e8; color: #f5222d; }
    .prob-type-tabs { display: flex; gap: 10px; margin-bottom: 12px; }
    .prob-type-tab { flex: 1; text-align: center; padding: 10px; border-radius: 8px; background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    .prob-type-tab.active { background: #1890ff; color: #fff; }

    /* 可搜索下拉 */
    .search-select { position: relative; }
    .search-select-input { width: 100%; height: 44px; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; font-size: 15px; outline: none; box-sizing: border-box; }
    .search-select-input:focus { border-color: #1890ff; }
    .search-select-dropdown { position: absolute; top: 48px; left: 0; right: 0; background: #fff; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.12); max-height: 240px; overflow-y: auto; z-index: 100; display: none; }
    .search-select-dropdown.open { display: block; }
    .search-select-option { padding: 10px 12px; font-size: 14px; color: #333; cursor: pointer; border-bottom: 1px solid #f5f5f5; }
    .search-select-option:last-child { border-bottom: none; }
    .search-select-option:hover, .search-select-option.highlighted { background: #e6f7ff; }
    .search-select-empty { padding: 20px; text-align: center; color: #999; font-size: 13px; }
  </style>
</head>
<body data-page="probability">
  <div class="page">
    <div class="navbar">
      <div class="title">录取概率测算</div>
    </div>

    <div class="prob-container">
      <!-- 学生类型选择 -->
      <div class="prob-type-tabs">
        <div class="prob-type-tab active" data-type="gaozhong" onclick="switchProbType('gaozhong')">普高生</div>
        <div class="prob-type-tab" data-type="zhongzhi" onclick="switchProbType('zhongzhi')">中职生</div>
      </div>

      <!-- 文化分输入 -->
      <div class="prob-card">
        <div class="prob-label">📝 统考文化分（满分300）</div>
        <div class="prob-input-row">
          <input type="number" class="prob-input" id="prob-culture" min="0" max="300" value="200" placeholder="输入你的文化分数">
          <span class="prob-unit">分</span>
        </div>
      </div>

      <!-- 学校选择（可搜索） -->
      <div class="prob-card">
        <div class="prob-label">🏫 选择学校</div>
        <div class="search-select" id="school-select">
          <input type="text" class="search-select-input" id="school-search" placeholder="输入学校名搜索，如：芜湖职业" autocomplete="off">
          <div class="search-select-dropdown" id="school-dropdown"></div>
        </div>
      </div>

      <!-- 专业选择（可搜索） -->
      <div class="prob-card" id="prob-major-card" style="display:none">
        <div class="prob-label">📚 选择专业</div>
        <div class="search-select" id="major-select">
          <input type="text" class="search-select-input" id="major-search" placeholder="输入专业名搜索，如：计算机" autocomplete="off">
          <div class="search-select-dropdown" id="major-dropdown"></div>
        </div>
      </div>

      <!-- 校考分数滑动条 -->
      <div class="prob-card" id="prob-exam-card" style="display:none">
        <div class="prob-label">🎯 校考分数 <span id="prob-exam-type" style="font-size:12px;color:#888;font-weight:normal"></span></div>
        <div class="prob-slider-value"><span id="prob-exam-value">200</span> 分</div>
        <input type="range" class="prob-slider" id="prob-exam-slider" min="0" max="300" value="200" oninput="onProbExamInput()">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#999;margin-top:6px">
          <span>0</span>
          <span id="prob-exam-max">满分 300</span>
        </div>
      </div>

      <!-- 计算结果 -->
      <div id="prob-result-area" style="display:none">
        <div class="prob-result">
          <div class="prob-result-title">录取概率</div>
          <div class="prob-percent" id="prob-percent">--%</div>
          <div class="prob-desc" id="prob-desc"></div>
        </div>

        <div class="prob-detail">
          <div class="prob-detail-row"><span>你的总分</span><b id="pr-your-score">--</b></div>
          <div class="prob-detail-row"><span>该校2026预估线</span><b id="pr-est-line">--</b></div>
          <div class="prob-detail-row"><span>120%预录取线</span><b id="pr-120-line">--</b></div>
          <div class="prob-detail-row"><span>数据来源</span><b id="pr-score-source" style="font-size:12px">--</b></div>
          <div class="prob-detail-row"><span>招生计划</span><b id="pr-plan">--</b></div>
          <div class="prob-detail-row"><span>分数计算方式</span><b id="pr-calc-rule" style="font-size:12px">--</b></div>
        </div>

        <div id="second-cutoff-box" style="display:none; background:#fffbe6; border:1px solid #ffe58f; border-radius:12px; padding:14px 16px; margin-top:12px; font-size:13px; line-height:1.7; color:#614700;">
          <div style="font-weight:bold; font-size:14px; margin-bottom:6px;">⚠️ 该校有校考入围（二次划线）机制</div>
          <div id="sc-ratio" style="margin-bottom:6px;"></div>
          <div id="sc-note" style="color:#874d00;"></div>
          <div id="sc-warn" style="margin-top:8px; font-weight:bold; color:#f5222d; display:none;"></div>
        </div>
      </div>

      <div style="height:20px"></div>
    </div>

    <div class="tabbar"></div>
  </div>

  <script src="js/data.js?v=20261015u"></script>
  <script src="js/app.js?v=20261015u"></script>
  <script src="js/low-score.js"></script>
  <script>
    let currentProbType = 'gaozhong';
    let schoolList = [];
    let majorList = [];
    let selectedSchoolId = null;
    let selectedMajorName = null;

    function switchProbType(type) {
      currentProbType = type;
      document.querySelectorAll('.prob-type-tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`[data-type="${type}"]`).classList.add('active');
      // 重新加载学校列表
      loadProbSchools();
      document.getElementById('prob-major-card').style.display = 'none';
      document.getElementById('prob-exam-card').style.display = 'none';
      document.getElementById('prob-result-area').style.display = 'none';
      selectedSchoolId = null;
      selectedMajorName = null;
      document.getElementById('school-search').value = '';
      document.getElementById('major-search').value = '';
    }

    function loadProbSchools() {
      // 只显示该类别 2026 确实有计划、且未停招的学校
      // （旧逻辑对「安徽艺术学院」这类文化300分档但无普高计划的院校也放行，
      //   选完学校后专业下拉恒为空，属于明显的交互坑）
      schoolList = COLLEGES.filter(c => {
        if (c.stoppedEnrollment) return false;
        if (currentProbType === 'gaozhong') return (c.plan2026Gaozhong || 0) > 0;
        return (c.plan2026Zhongzhi || 0) > 0;
      });
      schoolList.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
      renderSchoolDropdown('');
    }

    function renderSchoolDropdown(kw) {
      const dropdown = document.getElementById('school-dropdown');
      const list = kw ? schoolList.filter(s => s.name.includes(kw)) : schoolList;
      if (list.length === 0) {
        dropdown.innerHTML = '<div class="search-select-empty">未找到相关学校</div>';
        return;
      }
      dropdown.innerHTML = list.map(s => 
        `<div class="search-select-option" data-id="${s.id}" data-name="${s.name}">${s.name}（${s.city}）</div>`
      ).join('');
      dropdown.querySelectorAll('.search-select-option').forEach(opt => {
        opt.onclick = () => {
          selectedSchoolId = opt.dataset.id;
          document.getElementById('school-search').value = opt.dataset.name;
          dropdown.classList.remove('open');
          onProbSchoolChange();
        };
      });
    }

    function onProbSchoolChange() {
      const majorCard = document.getElementById('prob-major-card');
      const examCard = document.getElementById('prob-exam-card');
      const resultArea = document.getElementById('prob-result-area');
      
      if (!selectedSchoolId) {
        majorCard.style.display = 'none';
        examCard.style.display = 'none';
        resultArea.style.display = 'none';
        return;
      }

      const college = COLLEGES.find(c => c.id === Number(selectedSchoolId));
      if (!college || !college.majors) {
        // 学校名被改动后对不上任何院校：清掉选择，避免结果与输入框不一致
        selectedSchoolId = null;
        selectedMajorName = null;
        document.getElementById('major-search').value = '';
        majorCard.style.display = 'none';
        examCard.style.display = 'none';
        resultArea.style.display = 'none';
        return;
      }

      // 换学校时必须清掉旧专业，否则会拿上一所学校的专业名去新学校找
      selectedMajorName = null;

      // 加载专业
      majorList = college.majors.filter(m => {
        if (currentProbType === 'gaozhong') return m.plan2026Gaozhong > 0;
        return m.plan2026Zhongzhi > 0;
      });
      renderMajorDropdown('');
      document.getElementById('major-search').value = '';

      // 设置校考满分
      const examMax = getExamMax(college);
      const slider = document.getElementById('prob-exam-slider');
      slider.max = examMax;
      slider.value = Math.floor(examMax * 0.67);
      document.getElementById('prob-exam-value').textContent = slider.value;
      document.getElementById('prob-exam-max').textContent = '满分 ' + examMax;
      // 校考类型提示：满分随院校规则变化，不能写死
      const examTypeLabel = document.getElementById('prob-exam-type');
      const examName = currentProbType === 'zhongzhi' ? '职业技能考试' : '职业适应性测试';
      const rawExamMax = ruleOf(college).examMax;
      examTypeLabel.textContent =
        rawExamMax && rawExamMax !== examMax
          ? `（${examName}，章程满分 ${rawExamMax}，按合成分折算后本页满分 ${examMax}）`
          : `（${examName}，满分 ${examMax}）`;

      majorCard.style.display = 'block';
      examCard.style.display = 'block';
      resultArea.style.display = 'none';
    }

    function renderMajorDropdown(kw) {
      const dropdown = document.getElementById('major-dropdown');
      const list = kw ? majorList.filter(m => m.name.includes(kw)) : majorList;
      if (list.length === 0) {
        dropdown.innerHTML = '<div class="search-select-empty">未找到相关专业</div>';
        return;
      }
      dropdown.innerHTML = list.map(m => 
        `<div class="search-select-option" data-name="${m.name}">${m.name}</div>`
      ).join('');
      dropdown.querySelectorAll('.search-select-option').forEach(opt => {
        opt.onclick = () => {
          selectedMajorName = opt.dataset.name;
          document.getElementById('major-search').value = opt.dataset.name;
          dropdown.classList.remove('open');
          calcProb();
        };
      });
    }

    // 校考满分统一走 examMaxOf（见下方解析器定义处），这里只做转发，
    // 避免出现两份口径不同的实现（曾因重复定义导致滑块上限与总分口径不一致）
    function getExamMax(college) {
      return examMaxOf(college);
    }

    function getTotalMax(college) {
      return totalMaxOf(college);
    }

    function onProbExamInput() {
      const slider = document.getElementById('prob-exam-slider');
      document.getElementById('prob-exam-value').textContent = slider.value;
      calcProb();
    }

    function calcProb() {
      // 文化统考是省统考语数英合卷，满分固定 300，输入越界会让结果离谱
      const cultureEl = document.getElementById('prob-culture');
      let culture = Number(cultureEl.value);
      if (!Number.isFinite(culture) || culture < 0) culture = 0;
      if (culture > 300) {
        culture = 300;
        cultureEl.value = 300;
      }
      const examScore = Number(document.getElementById('prob-exam-slider').value) || 0;

      if (!selectedSchoolId || !selectedMajorName) return;

      const college = COLLEGES.find(c => c.id === Number(selectedSchoolId));
      if (!college) return;

      const major = college.majors.find(m => m.name === selectedMajorName);
      if (!major) return;

      // 计算总分
      const totalScore = calcTotalScore(college, culture, examScore);
      
      // 估算该校录取线
      const estLine = estimateCutoff(college, major);
      
      // 120%预录取线（优先使用专业级真实递补分）
      const majorScore = currentProbType === 'zhongzhi' ? major.score2026Zhongzhi : major.score2026Gaozhong;
      const preLine = (majorScore && majorScore.dibu) ? Number(majorScore.dibu) : (estLine - 10);
      
      // 招生计划
      const plan = currentProbType === 'gaozhong' ? (major.plan2026Gaozhong || 0) : (major.plan2026Zhongzhi || 0);

      // 计算录取概率
      const probability = calcProbability(totalScore, estLine, preLine, plan, college, major);

      // 显示结果
      document.getElementById('prob-result-area').style.display = 'block';
      document.getElementById('prob-percent').textContent = Math.round(probability) + '%';
      
      // 概率描述
      let desc = '';
      let badgeClass = '';
      if (probability >= 80) { desc = '录取希望很大，正常发挥即可'; badgeClass = 'high'; }
      else if (probability >= 60) { desc = '录取概率较大，建议做好保底'; badgeClass = 'mid'; }
      else if (probability >= 40) { desc = '有一定机会，建议同时考虑其他学校'; badgeClass = 'mid'; }
      else { desc = '录取难度较大，建议选择更稳妥的学校'; badgeClass = 'low'; }
      document.getElementById('prob-desc').innerHTML = desc + ' <span class="prob-badge ' + badgeClass + '">' + (probability >= 60 ? '较稳' : probability >= 40 ? '可冲' : '较悬') + '</span>';

      // 详情
      const axis = totalMaxOf(college);
      const yourEl = document.getElementById('pr-your-score');
      if (ruleOf(college).mode === 'sum') {
        yourEl.textContent = totalScore.toFixed(1) + ' 分';
      } else {
        // 加权类院校算出来是合成分（已折算到章程总分口径），
        // 直接写"N 分"会被误读成原始总分，所以标出满分与百分数
        yourEl.textContent =
          totalScore.toFixed(1) + ' / ' + axis + ' 分（' + ((totalScore / axis) * 100).toFixed(0) + '%）';
      }
      document.getElementById('pr-est-line').textContent = estLine + ' 分';
      document.getElementById('pr-120-line').textContent = preLine + ' 分';
      // 数据来源
      const ms = currentProbType === 'zhongzhi' ? major.score2026Zhongzhi : major.score2026Gaozhong;
      const sourceText = ms && ms.source ? ms.source : (college.realScore2026 ? '学校2026公示' : '综合估算');
      document.getElementById('pr-score-source').textContent = sourceText;
      document.getElementById('pr-plan').textContent = plan + ' 人';
      document.getElementById('pr-calc-rule').textContent = getCalcRuleText(college);

      // 二次划线（校考入围）提示
      const scBox = document.getElementById('second-cutoff-box');
      if (college.secondCutoff && college.secondCutoff.enabled) {
        scBox.style.display = 'block';
        document.getElementById('sc-ratio').innerHTML = '📏 入围比例：' + college.secondCutoff.ratio;
        document.getElementById('sc-note').textContent = college.secondCutoff.note;
        const warnEl = document.getElementById('sc-warn');
        // 文化统考满分300，省合格线82；入围线通常远高于合格线，给出经验提醒
        if (culture < 180) {
          warnEl.style.display = 'block';
          warnEl.style.color = '#f5222d';
          warnEl.textContent = '🚨 你的文化统考' + culture + '分偏低，可能无法达到该校校考入围线，连参加校考的资格都没有，志愿可能直接作废，慎报！';
        } else if (culture < 220) {
          warnEl.style.display = 'block';
          warnEl.style.color = '#fa8c16';
          warnEl.textContent = '⚠️ 你的文化统考' + culture + '分，建议关注官方3月公布的校考入围合格线，若未入围可等待二次降线或及时改报其他学校。';
        } else {
          warnEl.style.display = 'none';
        }
      } else {
        scBox.style.display = 'none';
      }
    }

    /* ============================================================
     * 成绩计算规则解析器
     *
     * 背景：全站 74 所院校的 scoreComposition 是人工整理的自然语言，共 58 种写法。
     * 旧实现只用 3 条精确字符串匹配（文化×40%+校考×60% 等），其余全部落进
     * "文化+校考直接相加" 兜底分支 —— 后果不只是算错，而是把 0-100 的百分制
     * 合成分与 0-600 的直接相加分放在同一根坐标轴上比，结论方向都会反。
     *
     * 例：安徽水利水电「文化300分 + 校考300分 = 总分600分（直接相加，各占50%）」
     *     旧代码按相加处理 → 文化200+校考200=400 当成 600 分制看，判"很稳"；
     *     实际该校是百分制合成 → (200+200)/2 = 200 分制，判"很悬"。
     *
     * 解析规则（严格按章程原文措辞）：
     *   1. 先找显式折算句「折算为百分制」「＝(文化/100+校考/100)×100%」→ 百分制
     *   2. 找权重三元组：每个分项后面跟的 ×N%；识别不到成分项名时按出现顺序对应
     *   3. 有分项说明「各占50%」→ 等权
     *   4. 权重和为 1 → 百分制合成；权重和 <1 且原文未声明满分 100 → 归一化后仍按百分制
     *   5. 都没有 → 原样相加（这类原文一般带「直接相加」与「总分600/700/750」）
     *   6. 单独按校考排序（校考即总分）→ 直接用校考分
     * ============================================================ */

    // 取锚点之前最近的「N分」（只往前找：分项名 → N分 → ×N% 是固定语序）
    function numberBefore(text, idx) {
      const re = /(\d{2,3})\s*分/g;
      let best = null;
      let m;
      while ((m = re.exec(text)) !== null) {
        const end = m.index + m[0].length;
        if (end <= idx) best = Number(m[1]);
      }
      return best;
    }

    const CULTURE_WORD = /文化/;
    const EXAM_WORD = /校考|职业适应性|职业技能|专业能力|技术技能|技能测试|面试|笔试/;
    // 校考分项名 + 紧邻分值。
    // ⚠ 用 lookahead 排除"总分"：否则「校考300分…= 总分600分」里的 600
    // 会被当成校考满分（曾把 600 分制算成 900）
    const EXAM_TOPIC_RE = /(?:校考|职业适应性测试|职业技能考试|职业技能|专业能力|技术技能|技能测试)(?:(?!总分)[^0-9%％；;。]){0,32}?(\d{2,3})\s*分?(?!\s*[分]?\s*[满总])/g;

    // 把「A+B」两个分项合并（相邻出现的两个分项分值视为同一项的和）
    function mergeAdjacentSums(text) {
      const hits = [...text.matchAll(EXAM_TOPIC_RE)].map((m) => ({
        v: Number(m[1]),
        start: m.index,
        end: m.index + m[0].length,
      }));
      const out = [];
      for (let i = 0; i < hits.length; i++) {
        const gap = i + 1 < hits.length ? hits[i + 1].start - hits[i].end : 999;
        if (gap >= 0 && gap <= 6 && i + 1 < hits.length) {
          out.push(hits[i].v + hits[i + 1].v);
          i++;
        } else {
          out.push(hits[i].v);
        }
      }
      return out;
    }
    // 文化分项满分；排除「= 总分N分」里的 N（数值前紧邻"总"或"分满"即视为总分）
    const CULTURE_SCORE_RE = /文化[素质]{0,2}[^%％；;]{0,8}?(?<![总分])(\d{2,3})\s*分/g;

    // 把「职业技能考试=专业能力210+技术技能90」里的分项分值加起来，得到校考满分
    function examMaxFromText(text) {
      const sums = [];
      for (const mm of text.matchAll(EXAM_TOPIC_RE)) {
        const start = mm.index + mm[0].length;
        // 该分项后面若紧跟「+另一个分项N分」则相加
        const rest = text.slice(start, start + 30);
        const plus = rest.match(/^\s*[＋+]\s*[^0-9]{0,12}?(\d{2,3})\s*分/);
        sums.push(Number(mm[1]) + (plus ? Number(plus[1]) : 0));
      }
      return sums.length ? Math.max(...sums) : null;
    }

    /* ============================================================
     * 成绩合成规则解析（最终版）
     *
     * 经全站 74 所院校原文逐条核对，规则只有三类，判据都是章程原文里的
     * 明确措辞，不再依赖模糊正则：
     *
     *   1. 原文写「直接相加」→ 坐标轴 = 声明的总分上限（600/700/750）
     *      你填的文化+校考直接与该轴上的预估线比较。
     *   2. 原文写「文化过线后按校考成绩排序」→ 坐标轴 = 百分制，
     *      用校考得分率折算（校考就是总成绩）。
     *   3. 其余带权重（文化×a% + 校考×b%）→ 坐标轴 = 声明的总分上限
     *      （若章程另给了"满分折合300分"这类说明则用它，如安徽审计），
     *      按章程公布的权重把两项归一化后映射到该轴；
     *      章程未声明上限的少数院校按百分制处理。
     *
     * 权重来源：只从"公式句"里取，公式句 = 含 ×N% 的那一块
     * （跨 ；分块时要合并到括号配平为止），因此不会与"分项满分说明"混淆。
     * ============================================================ */
    function parseComposition(college) {
      const raw = String((college && college.scoreComposition) || '');
      // 【必须】屏蔽年份（"（2026章程）"）：其前三位"202"会被各种模式
      // 当成满分，之前多所院校因此算出 202。等长替换保持下标不变。
      const text = raw.replace(/(19|20)\d{2}\s*年?/g, (s) => '-'.repeat(s.length));

      // 文化是否不计入合成（如安徽艺术"文化仅作合格线不计入合成"）。
      // 必须在使用之前算好，因为坐标轴与模式判定都要用
      const cultureExcluded = /文化[^。；]{0,12}(不计入|仅作合格线|只作合格线)/.test(text);

      // ---- 1) 分块，并拼出"公式句" ----
      const chunks = text.split(/[；;。]/).filter((s) => s.trim());
      // 优先挑"真正的成绩合成公式句"（文化×N% 或 校考×N% 或 文化÷3×N%），
      // 否则退而求其次找含任意 ×N% 的块 —— 避免把「创新类面试300分…×50%」
      // 这类说明误当公式（皖西卫生曾因此取到错误的 50/50）
      const isRealFormula = (s) =>
        /文化[^×x*%％；;]{0,16}?[×x*]\s*\d{1,3}\s*[%％]/.test(s) ||
        /(?:校考|职业适应性测试|职业技能考试|职业技能)[^×x*%％；;]{0,16}?[×x*]\s*\d{1,3}\s*[%％]/.test(s);
      let pctChunkIdx = chunks.findIndex(isRealFormula);
      if (pctChunkIdx < 0) pctChunkIdx = chunks.findIndex((s) => /[×x*]\s*\d{1,3}\s*[%％]/.test(s));
      let formula = '';
      if (pctChunkIdx >= 0) {
        // 公式句可能跨 ；分块（如「职业适应性测试=自我学习100+…；职业技能考试=…），
        // 所以从含 % 的那块起往后拼，直到括号配平
        let acc = '';
        let depthAll = 0;
        for (let i = pctChunkIdx; i < chunks.length; i++) {
          const piece = (i === pctChunkIdx ? '' : '；') + chunks[i];
          acc += piece;
          for (const ch of piece) {
            if (ch === '（' || ch === '(') depthAll++;
            else if (ch === '）' || ch === ')') depthAll = Math.max(0, depthAll - 1);
          }
          if (depthAll === 0 && /[%％]/.test(piece)) break;
        }
        // 去掉来源说明「（----章程）」，避免污染权重上下文
        formula = acc.replace(/[（(]-{2,}[^）)]*[）)]/g, '');
      }

      // ---- 2) 声明式总上限：从所有"总分/满分/折合N分制/N分）"候选里取最大值 ----
      const declaredCandidates = [
        ...[...text.matchAll(/总分\s*[＝=]?\s*(\d{3})/g)].map((m) => Number(m[1])),
        ...[...text.matchAll(/合计\s*满分\s*(\d{3})/g)].map((m) => Number(m[1])),
        ...[...text.matchAll(/满分\s*(\d{3})\s*分?/g)].map((m) => Number(m[1])),
        ...[...text.matchAll(/[＝=]\s*(\d{3})\s*分/g)].map((m) => Number(m[1])),
        // 「满分折合300分制」「折合300分制」
        ...[...text.matchAll(/折合\s*(\d{3})\s*分制/g)].map((m) => Number(m[1])),
        // 注意：不要把「（省统考300分）」这类"分项满分括注"算进来，
        // 否则"分项之和"会被当成声明总分（曾把 600 分制误判成 900）
      ].filter((v) => v >= 100 && v <= 900);
      const declaredBest = declaredCandidates.length ? Math.max(...declaredCandidates) : null;

      // ---- 3) 分项满分 ----
      // 全局取各项满分：学校常把「普高」与「中职」两套分列，
      // 取各单项的最大值即该校上限（把两套相加会算出不存在的总分）。
      const cultureMaxes = [...text.matchAll(CULTURE_SCORE_RE)].map((m) => Number(m[1]));
      const cultureMax = cultureMaxes.length ? Math.max(...cultureMaxes) : 300;
      const examMaxes = [...text.matchAll(EXAM_TOPIC_RE)].map((m) => Number(m[1]));
      // 分项拆分写法「=专业能力210+技术技能90」也合并成一项，
      // 注意 pairSums 可能又把这个大类整体算一遍（200+100=300），
      // 所以只有当它不超过"分项名+分值"的直接值时，才认为它是同一项
      const pairSums = [...text.matchAll(/(\d{2,3})\s*分\s*[＋+]\s*[^0-9]{0,12}?(\d{2,3})\s*分/g)].map(
        (m) => Number(m[1]) + Number(m[2])
      );
      const directExamMax = examMaxes.length ? Math.max(...examMaxes) : 0;
      // pairSums 只作兜底：文化里的"语数各120+英语60"也会被算成 pairSum(180)，
      // 用它抬高校考满分会把坐标轴算爆（多所 600 分制曾被抬到 900）
      let examMax = directExamMax;
      if (!examMax) {
        const ceil = declaredBest ? Math.max(0, declaredBest - cultureMax) : Infinity;
        for (const s of pairSums) if (s <= ceil) examMax = Math.max(examMax, s);
      }
      if (!examMax) examMax = declaredBest ? Math.max(100, declaredBest - cultureMax) : 300;
      // 校考项不能超过"声明总分 − 文化满分"（否则说明抓到了总分本身）
      if (declaredBest && declaredBest > cultureMax) {
        const examCeil2 = declaredBest - cultureMax;
        if (examMax > examCeil2) examMax = examCeil2;
      }
      // 未显式声明总分时的兜底坐标轴
      const clauseCap = cultureMax + examMax;

      // ---- 4) 从公式句里取权重（按"离 % 最近的分项名"判归属）----
      const tokens = [];
      for (const mm of formula.matchAll(/[×x*]\s*(\d{1,3})\s*[%％]/g)) {
        const head = formula.slice(0, mm.index);
        const ci = head.lastIndexOf('文化');
        const ei = Math.max(
          head.lastIndexOf('校考'),
          head.lastIndexOf('职业适应性'),
          head.lastIndexOf('职业技能'),
          head.lastIndexOf('专业能力'),
          head.lastIndexOf('技术技能'),
          head.lastIndexOf('技能测试')
        );
        let kind = 'unknown';
        if (ci >= 0 || ei >= 0) kind = ci > ei ? 'culture' : 'exam';
        tokens.push({ pct: Math.min(1, Number(mm[1]) / 100), kind });
      }
      const cultureToks = tokens.filter((t) => t.kind === 'culture');
      const examToks = tokens.filter((t) => t.kind === 'exam');
      const unknownToks = tokens.filter((t) => t.kind === 'unknown');

      let weightCulture = cultureToks.length ? cultureToks[0].pct : cultureToks.length === 0 && tokens.length === 1 && tokens[0].kind === 'culture' ? tokens[0].pct : null;
      let weightExam = examToks.length ? examToks.reduce((s, t) => s + t.pct, 0) : null;
      // 「=校考×100%」这种整条式子只有一个 100%：把文化权重当作 0（校考即总成绩）
      if (tokens.length === 1 && tokens[0].pct === 1) {
        weightCulture = 0;
        weightExam = 1;
      }

      // 只写了一个权重（如"按章程公式折算为百分制"未给数）→ 等权
      if (tokens.length === 1 && weightCulture === null && weightExam === null && /百分制/.test(text)) {
        weightCulture = 0.5;
        weightExam = 0.5;
      }
      // 权重和不足 1 且还有没定归属的 % → 用它补齐（如"文化×30%+校考×70%"）
      const partial = (weightCulture || 0) + (weightExam || 0);
      if (unknownToks.length && partial < 0.999) {
        const rest = unknownToks.reduce((s, t) => s + t.pct, 0);
        if (weightCulture === null) weightCulture = unknownToks[0].pct;
        else weightExam = Math.min(1, (weightExam || 0) + rest);
      }
      // 多项权重和 > 1 时归一化
      let wc = weightCulture;
      let we = weightExam;
      const total = (wc || 0) + (we || 0);
      if (total > 1.001) {
        wc = wc === null ? null : wc / total;
        we = we === null ? null : we / total;
      }
      const hasWeight = wc !== null || we !== null;

      // ---- 5) 模式判定 ----
      const directAdd = /直接相加/.test(text);
      const examOnly =
        /仅作合格线|合格线|按校考成绩排序|校考成绩本身/.test(text) &&
        (/按校考成绩排序|校考成绩本身|只按职业技能|按职业适应性|不计入合成|职业适应性测试\/职业技能考试/.test(text) || cultureExcluded);
      // 文化不计入合成（如"文化仅作合格线不计入合成"）
      // 公式本身是否已归一化到百分制（"文化÷3×40%+校考÷2×60%"这种先折百分制再加权）
      const normalizedByFormula =
        /÷\s*\d+\s*[×x*]\s*\d{1,3}\s*[%％]/.test(formula) || /合成满分\s*100\s*分/.test(text);

      // 分项满分之和（决定未显式声明总分时的坐标轴）。
      // 文化不计入合成时（如安徽艺术），总分就等于校考满分
      const capGuess = cultureExcluded ? examMax : Math.max(declaredBest || 0, cultureMax + (examMax || 0));

      let mode;
      let axisMax;
      if (examOnly) {
        mode = 'examOnly';
        axisMax = 100;
      } else if (directAdd || !hasWeight) {
        mode = 'sum';
        axisMax = Math.max(declaredBest || 0, capGuess) || 600;
      } else {
        // 带权重：把两项归一化后映射到坐标轴。
        // 轴取 max(声明总分, 分项满分之和)：有些学校声明总分与分项满分不一致
        // （如"校考450"却声明总分600），取二者较大值，保证满分输入不会被截断。
        // 带权重：坐标轴 = 文化满分 + 校考满分（两项归一化后映射到该轴）。
        // 这样"文化填满 + 校考填满"恰好等于总分上限，滑块与结果口径一致。
        const declared = cultureMax + (examMax || 0) || declaredBest || 0;
        // 「(文化/100+校考/100)×100%」这种整条只有一个 100% 的，本质就是百分制
        const degenerateHundred = tokens.length === 1 && tokens[0].pct === 1 && !declaredBest;
        if (declared && !normalizedByFormula && !degenerateHundred) {
          mode = 'weightedScaled';
          axisMax = declared;
        } else {
          mode = 'percent';
          axisMax = 100;
        }
      }
      // 展示用：无论哪种模式，都报出实际坐标轴
      const declaredMax = axisMax;

      return {
        mode,
        axisMax,
        declaredMax,
        cultureMax,
        examMax,
        weightCulture,
        weightExam,
        hasWeight,
        weightSum: (weightCulture || 0) + (weightExam || 0),
        tokens: tokens.map((t) => `${t.kind}:${t.pct}`),
        formula,
        raw,
      };
    }
    // 每个院校只解析一次
    const _compositionCache = new Map();
    function ruleOf(college) {
      const key = (college && college.id) + '';
      if (!_compositionCache.has(key)) _compositionCache.set(key, parseComposition(college));
      return _compositionCache.get(key);
    }

    // 校考满分（同时决定页面滑块上限）。
    // 坐标轴口径必须与 calcTotalScore 一致：
    //   sum          → 校考按章程分项满分（满分输入 + 文化满分 = 轴上限）
    //   weightedScaled → 校考按其在合成分里的占比折算（满分输入对应轴上限）
    //   percent      → 校考按原始分项满分，由 calcTotalScore 归一化到 0-100
    //   examOnly     → 校考满分就是轴上限（校考即总成绩）
    function examMaxOf(college) {
      const rule = ruleOf(college);
      if (rule.mode === 'sum') return rule.examMax || 300;
      if (rule.mode === 'percent') return rule.examMax || 300;
      if (rule.mode === 'examOnly') return rule.examMax || rule.axisMax || 100;
      const we = rule.weightExam === null ? 0.5 : rule.weightExam;
      const sum = (rule.weightCulture || 0) + we;
      return Math.max(50, Math.round(rule.axisMax * (sum > 0 ? we / sum : 0.5)));
    }

    function cultureMaxOf(college) {
      const rule = ruleOf(college);
      // 少数学校把普高/中职分列（如"文化300分(语文120+数学120+英语60)"），取识别到的最大值
      return rule && rule.cultureMax ? rule.cultureMax : 300;
    }

    function totalMaxOf(college) {
      return ruleOf(college).axisMax;
    }

    // 你输入的分数 → 用于比较的等效分
    function calcTotalScore(college, culture, exam) {
      const rule = ruleOf(college);
      const cm = cultureMaxOf();
      const em = examMaxOf(college) || 100;

      if (rule.mode === 'examOnly') return (exam / em) * 100;
      if (rule.mode === 'sum') return culture + exam;

      const kwc = rule.weightCulture === null ? 0.5 : rule.weightCulture;
      const kwe = rule.weightExam === null ? 0.5 : rule.weightExam;
      const kWSum = kwc + kwe;

      if (rule.mode === 'weightedScaled') {
        // 按章程公布的权重把两项归一化后映射到坐标轴
        const axis = rule.axisMax || 600;
        // 极少数章程把"普高300 / 中职600"两套分列，此时本页滑块只有一套，
        // 用 clamp 兜住，保证结果永远落在坐标轴内
        const raw = ((culture / cm) * kwc + (exam / em) * kwe) * axis;
        return Math.min(axis, Math.max(0, raw));
      }
      // 百分制（章程未声明总分上限的少数院校）
      if (kWSum <= 0) return 0;
      return (((culture / cm) * kwc + (exam / em) * kwe) / kWSum) * 100;
    }

    /* 用于界面提示：加权类院校除了合成分，再给出折算百分数便于理解 */
    function axisPercentOf(college, totalScore) {
      const axis = totalMaxOf(college);
      if (!axis) return null;
      return (totalScore / axis) * 100;
    }

    function getCalcRuleText(college) {
      const rule = ruleOf(college);
      const p = (x) => Math.round(x * 100) + '%';
      if (rule.mode === 'examOnly') return '文化过线后按校考成绩排序（校考成绩即总成绩）';
      if (rule.mode === 'sum') return `文化 + 校考（直接相加，满分 ${rule.declaredMax || 600}）`;
      const parts = [];
      if (rule.weightCulture !== null) parts.push(`文化×${p(rule.weightCulture)}`);
      if (rule.weightExam !== null) parts.push(`校考×${p(rule.weightExam)}`);
      if (!parts.length) return '文化 + 校考（直接相加）';
      if (rule.mode === 'weightedScaled') {
        return `${parts.join(' + ')}，按满分 ${rule.declaredMax} 折算`;
      }
      const note = Math.abs(rule.weightSum - 1) > 0.01 ? '（章程权重和不足100%，已归一化）' : '';
      return `${parts.join(' + ')}，折算百分制${note}`;
    }

    function estimateCutoff(college, major) {
      const isZhongzhi = currentProbType === 'zhongzhi';

      // 最高优先级：专业级2026真实分数（score2026Gaozhong/score2026Zhongzhi）
      const majorScore = isZhongzhi ? major.score2026Zhongzhi : major.score2026Gaozhong;
      if (majorScore && majorScore.pre) {
        return Number(majorScore.pre);
      }

      // 优先使用2026年真实数据（分别取普高/中职对应分数）
      if (college.realScore2026) {
        const totalMax = getTotalMax(college);
        const nums = college.realScore2026.match(/\d+/g);
        // 含"普高X/中职Y"格式时，分别取
        const gzMatch = college.realScore2026.match(/普高[^\d]*(\d+)/);
        const zzMatch = college.realScore2026.match(/中职[^\d]*(\d+)/);
        // 把真实分归一到本页的比较坐标轴（直接相加用原始分，加权用百分制）
        const toAxis = (v) => (totalMax === 100 ? Math.min(100, v) : Math.min(v, totalMax));
        if (isZhongzhi && zzMatch) {
          const v = Number(zzMatch[1]);
          if (v <= totalMax * 2) return toAxis(v);
        }
        if (!isZhongzhi && gzMatch) {
          const v = Number(gzMatch[1]);
          if (v <= totalMax * 2) return toAxis(v);
        }
        if (nums && nums.length > 0 && !gzMatch && !zzMatch) {
          const rs = Math.max(...nums.map(Number));
          if (rs <= totalMax * 2) return toAxis(rs);
        }
      }

      // 基于抖音多源数据的文化课分数线梯队（普高基准）
      // 头部260+ / 合肥热门230+ / 地级市220+ / 普通公办180+ / 低分公办150-160
      let cultureEst;
      const hotSchools = ['安徽职业技术大学','芜湖职业技术大学','安徽应用技术职业大学','安徽第二医学院','合肥职业技术学院','安徽水利水电职业技术学院','安徽交通职业技术学院','安徽警官职业学院'];
      const hefeiHot = ['安徽审计职业学院','安徽工商职业学院','安徽财贸职业学院','安徽城市管理职业学院','安徽公安职业学院','安徽中医药高等专科学校','安徽医学高等专科学校'];
      const isHot = hotSchools.some(s => college.name.includes(s.replace('职业技术大学','').replace('职业技术学院',''))) || college.hot;
      const isHefei = college.city === '合肥';

      if (isHot) cultureEst = 260;
      else if (isHefei && hefeiHot.some(s => college.name.includes(s))) cultureEst = 230;
      else if (isHefei) cultureEst = 210;
      else if (college.type === '医药类' || college.type === '师范类') cultureEst = 220;
      else cultureEst = 180;

      // 中职生文化课分数线普遍比普高低10-15分（抖音多源验证）
      if (isZhongzhi) cultureEst -= 12;

      // 校考预估：按校考满分的固定比例取
      // 普高生职业适应性测试平均约62%，中职生职业技能考试有专业基础，约68%
      const examMax = getExamMax(college);
      const examRatio = isZhongzhi ? 0.68 : 0.62;
      const examEst = examMax * examRatio;

      // 按该校章程的合成规则算预估线（与此前 calcTotalScore 用的是同一套函数，
      // 保证"你的分"和"预估线"在同一根坐标轴上）
      let totalEst = calcTotalScore(college, cultureEst, examEst);

      // 根据招生计划调整
      const plan = isZhongzhi ? (major.plan2026Zhongzhi || 0) : (major.plan2026Gaozhong || 0);
      if (plan > 200) totalEst -= 15;
      else if (plan > 100) totalEst -= 8;
      else if (plan < 30 && plan > 0) totalEst += 8;

      // 志愿优先学校，冷门专业可以更低
      const rule = college.admissionRule2026 || '';
      if (rule.includes('志愿优先') || rule.includes('专业优先') || rule.includes('专业清')) {
        const coldMajorPattern = /材料|养老|纺织|农林|畜牧|水产|地质|矿业|殡葬|图书馆|档案/;
        if (coldMajorPattern.test(major.name)) {
          totalEst -= 30;
        }
      }

      return Math.round(totalEst);
    }

    function calcProbability(yourScore, estLine, preLine, plan, college, major) {
      // 阈值必须按坐标轴缩放：600 分制差 30 分相当于百分制的 5 分，
      // 直接用绝对分会把百分制院校的概率算得极其离谱。
      const axisMax = totalMaxOf(college) || 600;
      const k = axisMax / 600;

      const diff = yourScore - estLine;
      let prob;

      if (diff >= 30 * k) prob = 95;
      else if (diff >= 15 * k) prob = 85;
      else if (diff >= 5 * k) prob = 72;
      else if (diff >= -5 * k) prob = 55;
      else if (diff >= -15 * k) prob = 38;
      else if (diff >= -25 * k) prob = 22;
      else if (diff >= -40 * k) prob = 10;
      else prob = 3;

      // 120%预录取线：过线就有较大机会（120%投档规则，会有递补）
      if (yourScore >= preLine && yourScore < estLine) {
        prob = Math.max(prob, 48);
      }

      const rule = college.admissionRule2026 || '';
      const isVolunteerFirst = rule.includes('志愿优先') || rule.includes('专业优先') || rule.includes('专业清');
      const isScoreFirst = rule.includes('分数优先');

      // 志愿优先/专业优先学校：冷门专业有捡漏机会
      if (isVolunteerFirst) {
        const coldMajorPattern = /材料|养老|纺织|农林|畜牧|水产|地质|矿业|殡葬|图书馆|档案|休闲|体育|艺术|音乐|表演|书画|体能/;
        if (coldMajorPattern.test(major.name)) {
          prob += 15; // 冷门专业额外加15%
        }
        // 志愿优先整体比分数优先波动大，低分有机会
        if (diff < 0) prob += 5;
      }

      // 分数优先学校：没有捡漏，分不够就是不行
      if (isScoreFirst && diff < -20) {
        prob -= 8;
      }

      // 学校热度调整
      if (college.hot) prob -= 5;
      
      // 招生计划调整
      if (plan >= 200) prob += 5;
      else if (plan <= 30 && plan > 0) prob -= 5;

      return Math.max(2, Math.min(97, prob));
    }

    // 初始化
    loadProbSchools();
    document.getElementById('prob-culture').addEventListener('input', calcProb);

    // 搜索框事件
    document.getElementById('school-search').addEventListener('focus', () => {
      document.getElementById('school-dropdown').classList.add('open');
    });
    document.getElementById('school-search').addEventListener('input', (e) => {
      renderSchoolDropdown(e.target.value.trim());
      document.getElementById('school-dropdown').classList.add('open');
    });
    document.getElementById('major-search').addEventListener('focus', () => {
      document.getElementById('major-dropdown').classList.add('open');
    });
    document.getElementById('major-search').addEventListener('input', (e) => {
      renderMajorDropdown(e.target.value.trim());
      document.getElementById('major-dropdown').classList.add('open');
    });

    // 点击其他地方关闭下拉
    document.addEventListener('click', (e) => {
      if (!e.target.closest('#school-select')) {
        document.getElementById('school-dropdown').classList.remove('open');
      }
      if (!e.target.closest('#major-select')) {
        document.getElementById('major-dropdown').classList.remove('open');
      }
    });
  </script>
